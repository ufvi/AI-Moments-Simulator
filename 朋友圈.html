            function confirmDeleteAccount(accId) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML =
                    `<div class="modal-dialog"><p>确定删除此账号吗？其动态将保留但显示为“未知用户”。</p><div class="btn-row"><button class="btn btn-cancel" id="cancelDel">取消</button><button class="btn btn-danger" id="confirmDel">删除</button></div></div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('#cancelDel').onclick = () => overlay.remove();
                overlay.querySelector('#confirmDel').onclick = () => {
                    accounts = accounts.filter(a => a.id !== accId);
                    saveAccounts();
                    if (currentId === accId) {
                        currentId = accounts[0]?.id || null;
                        localStorage.setItem(KEY_CUR, currentId);
                    }
                    overlay.remove();
                    renderHeader();
                    renderDropdown();
                    renderTimeline(true);
                    showToast('🗑️ 账号已删除');
                };
            }

            function renderPublishPreview() {
                $publishPreview.innerHTML = publishFiles.map((mf, i) =>
                    `<div class="publish-preview-item">${mf.type === 'video' ? `<video src="${mf.previewUrl}" muted></video><span class="media-type-badge">视频</span>` : `<img src="${mf.previewUrl}">`}<button class="remove-btn" data-remove="${i}">✕</button></div>`
                ).join('');
                document.querySelectorAll('#publishPreview .remove-btn').forEach(b => b.onclick = function () {
                    const idx = parseInt(this.dataset.remove);
                    const mf = publishFiles.splice(idx, 1)[0];
                    if (!mf.mediaId) URL.revokeObjectURL(mf.previewUrl);
                    renderPublishPreview();
                    updatePublishBtn();
                });
            }

            function updatePublishBtn() {
                $charCount.textContent = $publishText.value.length + '/2000';
                $btnPublish.disabled = !$publishText.value.trim() && !publishFiles.length;
            }

            function stripMarkdown(text) {
                if (!text) return '';
                let s = text;
                s = s.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                s = s.replace(/\*\*(.+?)\*\*/g, '$1');
                s = s.replace(/\*(.+?)\*/g, '$1');
                s = s.replace(/~~(.+?)~~/g, '$1');
                s = s.replace(/__(.+?)__/g, '$1');
                s = s.replace(/\|\|(.+?)\|\|/g, '$1');
                s = s.replace(/`(.+?)`/g, '$1');
                s = s.replace(/<[^>]*>/g, '');
                return s;
            }

            function removeSpaces(s) {
                return s.replace(/\s+/g, '');
            }

            // 搜索
            function filterPosts(keyword) {
                if (!keyword.trim()) return posts;
                const kw = removeSpaces(keyword.toLowerCase());
                return posts.filter(p => {
                    const rawText = removeSpaces((p.text || '').toLowerCase());
                    const rawNick = removeSpaces((getAcc(p.userId)?.nickname || '').toLowerCase());
                    const marklessText = removeSpaces(stripMarkdown(p.text || '').toLowerCase());
                    const marklessNick = removeSpaces(stripMarkdown(getAcc(p.userId)?.nickname || '').toLowerCase());
                    return rawText.includes(kw) || rawNick.includes(kw) ||
                        marklessText.includes(kw) || marklessNick.includes(kw);
                });
            }

            function renderSearchResults(keyword) {
                const filtered = filterPosts(keyword).sort((a, b) => b.timestamp - a.timestamp);
                $timeline.innerHTML = '';
                if (!filtered.length) {
                    $timeline.innerHTML =
                        '<div class="timeline-empty"><span class="empty-icon">🔍</span><p>未找到相关动态</p></div>'; return;
                }
                filtered.forEach(p => {
                    const div = document.createElement('div');
                    div.innerHTML = renderCard(p);
                    $timeline.appendChild(div.firstElementChild);
                });
                bindCardEvents();
                observeMediaInContainer($timeline);
                $loader.style.display = 'none';
            }

            window.addEventListener('scroll', () => {
                if (searchActive || renderedCount >= posts.length) return;
                const scrollBottom = window.scrollY + window.innerHeight;
                if (scrollBottom >= document.body.offsetHeight - 150) {
                    $loader.style.display = 'block';
                    setTimeout(() => renderTimeline(false), 200);
                }
            }, { passive: true });

            // ZIP 导出/导入
            async function exportData() {
                showProgress('⏳ 正在收集媒体文件...');
                try {
                    const zip = new JSZip();
                    const mediaFolder = zip.folder("media");
                    const allIds = new Set();
                    posts.forEach(p => { (p.images || []).forEach(id => allIds.add(id)); (p.videos || []).forEach(id => allIds.add(id)); });

                    let processed = 0;
                    const total = allIds.size;
                    for (const mid of allIds) {
                        const rec = await getMedia(mid);
                        if (rec) {
                            mediaFolder.file(`${mid}.${rec.type === 'image' ? 'jpg' : 'mp4'}`, rec.blob);
                        }
                        processed++;
                        showProgress(`⏳ 打包媒体文件... ${processed}/${total}`);
                    }

                    showProgress('⏳ 正在生成压缩包...');
                    zip.file("moments_data.json", JSON.stringify({ version: 2, accounts, currentId, posts, aiConfig, exportedAt: new Date().toISOString() }));
                    const blob = await zip.generateAsync({ type: "blob" });

                    // --- 原来的下载/分享逻辑不变，但成功后记得关闭进度提示 ---
                    hideProgress();
                    const fileName = `moments_${new Date().toISOString().slice(0, 10)}.zip`;
                    const file = new File([blob], fileName, { type: 'application/zip' });

                    let shared = false;
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ files: [file], title: '朋友圈备份' });
                            shared = true;
                            showToast('✅ 已分享');
                        } catch (shareErr) { }
                    }
                    if (!shared) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        showToast('✅ 导出完成');
                    }
                } catch (e) {
                    hideProgress();
                    showToast('❌ 导出失败: ' + e.message);
                }
            }

            function importData(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        if (file.name.endsWith('.zip')) await importFromZip(e.target.result);
                        else if (file.name.endsWith('.json')) await importFromJSON(e.target.result);
                        else showToast('❌ 不支持的文件');
                    } catch (err) { showToast('❌ ' + err.message); }
                };
                reader.readAsArrayBuffer(file);
            }

            async function importFromZip(buffer) {
                const zip = await JSZip.loadAsync(buffer);
                const jsonFile = zip.file("moments_data.json");
                if (!jsonFile) throw new Error('无元数据');
                const data = JSON.parse(await jsonFile.async("string"));
                await applyImport(data, zip);
            }

            async function importFromJSON(buffer) {
                const decoder = new TextDecoder();
                const data = JSON.parse(decoder.decode(buffer));
                if (data.mediaMap)
                    for (const [mid, info] of Object.entries(data.mediaMap)) await saveMedia(mid, base64ToBlob(info.base64),
                        info.type);
                await applyImport(data, null);
            }

            async function applyImport(data, zip) {
                const isReplace = confirm('替换全部数据？(取消则合并)');
                clearMediaCache();

                if (isReplace) {
                    const db = await openDB();
                    await new Promise((r, rej) => {
                        const tx = db.transaction('media', 'readwrite');
                        tx.objectStore('media').clear();
                        tx.oncomplete = r;
                        tx.onerror = rej;
                    });

                    if (zip) {
                        const mediaFiles = Object.entries(zip.folder("media")?.files || {});
                        const entries = [];
                        for (const [path, file] of mediaFiles) {
                            // 去掉路径，只保留文件名
                            const fileName = path.split('/').pop();
                            // 去掉扩展名（.jpg 或 .mp4），得到正确的 media ID
                            const mid = fileName.replace(/\.(jpg|mp4)$/, '');
                            const blob = await file.async("blob");
                            if (!blob) continue;
                            const type = path.endsWith('.mp4') ? 'video' : 'image';
                            entries.push({ id: mid, blob, type });
                        }

                        if (entries.length > 0) {
                            const tx = db.transaction('media', 'readwrite');
                            const store = tx.objectStore('media');
                            for (const entry of entries) {
                                store.put(entry);
                            }
                            await new Promise((r, rej) => { tx.oncomplete = r; tx.onerror = rej; });
                        }
                    }

                    accounts = data.accounts; saveAccounts();
                    currentId = data.currentId || accounts[0]?.id;
                    localStorage.setItem(KEY_CUR, currentId);
                    posts = data.posts; savePosts();
                    if (data.aiConfig) { aiConfig = data.aiConfig; saveAIConfig(); }

                } else {
                    const existAccIds = new Set(accounts.map(a => a.id));
                    accounts = [...accounts, ...data.accounts.filter(a => !existAccIds.has(a.id))]; saveAccounts();
                    const existPostIds = new Set(posts.map(p => p.id));
                    posts = [...posts, ...data.posts.filter(p => !existPostIds.has(p.id))]; savePosts();

                    if (zip) {
                        const mediaFiles = Object.entries(zip.folder("media")?.files || {});
                        for (const [path, file] of mediaFiles) {
                            try {
                                const match = path.match(/(media_[^.]+)/);
                                if (!match) continue;
                                const mid = match[1];
                                if (await getMedia(mid)) continue;
                                const blob = await file.async("blob");
                                if (!blob) continue;
                                const type = path.endsWith('.mp4') ? 'video' : 'image';
                                await saveMedia(mid, blob, type);
                            } catch (err) { console.warn('合并跳过:', path, err.message); }
                        }
                    }
                    if (data.aiConfig) { aiConfig = { ...aiConfig, ...data.aiConfig }; saveAIConfig(); }
                }

                ensureAIAccount();
                clearMediaCache();
                renderHeader();
                renderDropdown();
                renderTimeline(true);
                updatePublishBtn();
                showToast('✅ 导入成功');
                console.log('导入完成，当前动态数:', posts.length);
            }

            function base64ToBlob(b64) {
                const parts = b64.split(','),
                    mime = parts[0].match(/:(.*?);/)?.[1] || 'image/png';
                const bytes = atob(parts[1]),
                    arr = new Uint8Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                return new Blob([arr], { type: mime });
            }

            function formatTime(ts) {
                const diff = Date.now() - ts;
                if (diff < 0) {
                    const d = new Date(ts);
                    return `未来 · ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                }
                if (diff < 6e4) return '刚刚';
                if (diff < 3.6e6) return Math.floor(diff / 6e4) + '分钟前';
                if (diff < 8.64e7) return Math.floor(diff / 3.6e6) + '小时前';
                if (diff < 6.048e8) return Math.floor(diff / 8.64e7) + '天前';
                const d = new Date(ts);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            function compressImg(file, maxW, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let w = img.width,
                                h = img.height; if (w > maxW) {
                                    h = h * maxW / w;
                                    w = maxW;
                                }
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            canvas.toBlob(b => b ? resolve(b) : reject(new Error('压缩失败')), 'image/jpeg',
                                quality);
                        };
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            function compressImgToDataUrl(file, maxW, quality, cb) {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width,
                            h = img.height; if (w > maxW) {
                                h = h * maxW / w;
                                w = maxW;
                            }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        cb(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            }
